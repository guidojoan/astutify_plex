services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/felicity/Docker/jackett/config:/config
      - /media:/media
    ports:
      - 9117:9117
    restart: unless-stopped
    networks:
      - net
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - VERSION=docker
    volumes:
      - /home/felicity/Docker/plex/config:/config
      - /media:/media
    ports:
      - 32400:32400
    restart: unless-stopped
    network_mode: host
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/felicity/Docker/radarr/config:/config
      - /media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - net
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/felicity/Docker/sonarr/config:/config
      - /media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - net
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /home/felicity/Docker/transmission/config:/config
      - /media:/media
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    networks:
      - net
networks:
  net:
    driver: bridge